<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071820" />
    <meta name="description" content="Interactive DENR-EMB Region VII pixel office with walking staff and scripted bot personas." />
    <title>ENVIS | Pixel Office</title>
  </head>
  <body>
    <div class="scanlines" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-mark" aria-hidden="true">▣</div>
        <div class="brand-copy"><strong>ENVIS PIXEL OFFICE</strong><span>DENR-EMB REGION VII · STAFF &amp; BOTS</span></div>
        <div class="topbar-spacer"></div>
        <div id="session-clock" class="session-clock" title="Pixel Office session">--:--</div>
        <button id="night-button" class="top-button secondary" type="button">Night</button>
        <button id="bots-button" class="top-button secondary" type="button">Bots</button>
        <button id="directory-button" class="top-button" type="button">Personnel</button>
        <button id="leadership-button" class="top-button secondary" type="button">Leadership</button>
        <button id="help-button" class="top-button secondary" type="button">How to use</button>
      </header>
      <main class="stage-wrap">
        <div id="game-container" aria-label="Interactive DENR-EMB Region VII pixel office floor map"></div>
        <aside id="info-panel" class="info-panel is-hidden" aria-live="polite">
          <button id="close-panel" class="close-button" type="button" aria-label="Close panel">×</button>
          <div id="panel-content">
            <div class="panel-kicker">DENR-EMB REGION VII</div>
            <h2 id="panel-title">Office Information</h2>
          </div>
        </aside>
        <aside id="bot-panel" class="bot-panel is-hidden" aria-live="polite">
          <div class="bot-head">
            <div class="bot-head-copy">
              <div id="bot-avatar" class="bot-avatar">KA</div>
              <div><div class="bot-kicker">BOT LINK</div><strong id="bot-name">Office Bot</strong></div>
            </div>
            <button id="close-bot" class="close-button" type="button" aria-label="Close chat">×</button>
          </div>
          <div id="bot-messages" class="bot-messages"></div>
          <div id="bot-prompts" class="bot-prompts"></div>
          <form id="bot-form" class="bot-form">
            <input id="bot-input" class="bot-input" type="text" maxlength="240" autocomplete="off" placeholder="Type a message…" />
            <button class="bot-send" type="submit">SEND</button>
          </form>
        </aside>
      </main>
      <footer class="footer-bar">
        <span>DENR-EMB REGION VII</span>
        <span>CLICK A WALKING WORKER TO CHAT · CLICK A ROOM FOR DETAILS</span>
        <span>ENVIS PIXEL OFFICE · MIS / RD ONLY</span>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
